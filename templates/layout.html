<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
      .navbar-nav {
        gap: 1rem;
      }
      .navbar-nav .nav-link {
        position: relative;
        padding-bottom: 0.25rem;
      }
      .navbar-nav .nav-link.active {
        font-weight: 700;
        color: #1f396e;
      }
      .navbar-nav .nav-link.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background-color: currentColor;
        border-radius: 2px;
      }
      .navbar-nav .nav-link:hover {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light mb-4">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-5 mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link{% if request.path.endswith('/') %} active{% endif %}" href="{{ url_for('inventory_list') }}">Inventory</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if request.path.startswith('/probe-inventory') %} active{% endif %}" href="{{ url_for('probe_inventory_list') }}">Probe Inventory</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if request.path.startswith('/dashboard') %} active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if request.path == '/import' %} active{% endif %}" href="{{ url_for('import_page') }}">Import</a>
            </li>
          </ul>
        </div>
          <img src="{{ url_for('static', filename='ptech-logo.webp') }}" alt="PrymeTech Logo" class="img-fluid" style="max-height: 75px;">
      </div>
    </nav>
    <div class="container">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
