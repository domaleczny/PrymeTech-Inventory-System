{% extends 'layout.html' %}
{% block content %}
  <h1>Item detail</h1>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Part Number</label>
      <input class="form-control" value="{{ item.part_number }}" disabled>
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <input class="form-control" name="description" value="{{ item.description or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Location</label>
      <input class="form-control" name="location" value="{{ item.location or '' }}">
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Quantity</label>
        <input class="form-control" name="quantity" type="number" value="{{ item.quantity }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Min Quantity</label>
        <input class="form-control" name="min_quantity" type="number" value="{{ item.min_quantity }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Customer</label>
        <input class="form-control" name="customer" value="{{ item.customer or '' }}">
      </div>
    </div>
  

    <div class="mb-3 mt-4">
      <label class="form-label">Last Modified</label>
      <input class="form-control" value="{{ item.last_modify_date }}" disabled>
    </div>
      <input type="hidden" name="last_modify_date" value="{{ item.last_modify_date }}">
      <div class="mb-4 mt-4" style="display: flex; gap: 1rem;">
      <button class="btn" style="background-color: #1f396e; color: white;" type="submit">Save Changes</button>
      <a class="btn btn-secondary" href="{{ url_for('inventory_list') }}"><i class="bi bi-arrow-return-left"></i></a>
      <a 
        class="btn btn-danger"
        style="margin-left: auto;" 
        href="{{ url_for('remove_inventory_item', item_id=item.id) }}"
        onclick="return confirm('Are you sure you want to remove this item from inventory?');">
        <i class="bi bi-trash"></i> Remove
      </a>
    </div>
  </form>

{% endblock %}
