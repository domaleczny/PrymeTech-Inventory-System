{% extends 'layout.html' %}
{% block content %}

<form method="post" enctype="multipart/form-data">
<div class="row g-4">

  <!-- Main Information Card -->
  <div class="col-lg-8">

    <div class="card shadow-sm">

      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h4 style="color: #1f396e;" class="mb-0">{{ item.part_number }}</h4>
      </div>

      <div class="card-body">

        <!-- Row 1 -->
        <div class="mb-4">
          <label class="form-label fw-semibold">Description</label>
          <input
            class="form-control"
            name="description"
            value="{{ item.description or '' }}">
        </div>

        <!-- Row 2 -->
        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Location</label>
            <input
              class="form-control"
              name="location"
              value="{{ item.location or '' }}">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Customer</label>
            <input
              class="form-control"
              name="customer"
              value="{{ item.customer or '' }}">
          </div>
        </div>

        <!-- Row 3 -->
        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Quantity</label>
            <input
              class="form-control"
              type="number"
              name="quantity"
              value="{{ item.quantity }}">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Min Quantity</label>
            <input
              class="form-control"
              type="number"
              name="min_quantity"
              value="{{ item.min_quantity }}">
          </div>
        </div>

      </div>
      <div class="d-flex card-footer align-items-center bg-white">

          <button
            class="btn"
            style="background:#1f396e;color:white;"
            type="submit">
            Save Changes
          </button>

          <a
            class="btn btn-secondary ms-2"
            href="{{ url_for('inventory_list') }}">
            <i class="bi bi-arrow-return-left"></i>
          </a>

          <a
            class="btn btn-danger ms-auto"
            href="{{ url_for('remove_inventory_item', item_id=item.id) }}"
            onclick="return confirm('Are you sure you want to remove this item from inventory?');">
            <i class="bi bi-trash"></i> Remove
          </a>

        </div>
    </div>

  </div>

  <!-- Image Card -->
  <div class="col-lg-4">

    <div class="card shadow-sm h-100">

      <div class="card-header bg-white">
        <h5 class="mb-0">Image</h5>
      </div>

      <div class="card-body text-center">

        {% if item.image_path %}
            <img src="{{ url_for('static', filename='uploads/' ~ item.image_path) }}"
                class="img-fluid rounded border"
                style="height:300px; width:100%; object-fit:contain;">
        {% else %}
            <div class="border rounded d-flex align-items-center justify-content-center text-muted"
                style="height:300px;">
                No image uploaded
            </div>
        {% endif %}

      </div>

      <div class="card-footer bg-white">
        <input
            class="form-control"
            type="file"
            name="image"
            accept="image/*">
      </div>

    </div>

  </div>

</div>

<input
    type="hidden"
    name="last_modify_date"
    value="{{ item.last_modify_date }}">

</form>

{% endblock %}
