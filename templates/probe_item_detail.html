{% extends 'layout.html' %}
{% block content %}

<form method="post" enctype="multipart/form-data">

<div class="row g-4">

    <!-- LEFT COLUMN -->
    <div class="col-lg-8">

        <div class="card shadow-sm h-100">

            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h4 style="color: #1f396e;" class="mb-0">{{ item.part_number }}</h4>
            </div>

            <div class="card-body">

                <!-- Description -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Description</label>
                    <input class="form-control"
                          name="description"
                          value="{{ item.description or '' }}">
                </div>

                <!-- Location / Customer -->
                <div class="row mb-4">

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Location</label>
                        <input class="form-control"
                              name="location"
                              value="{{ item.location or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Customer</label>
                        <input class="form-control"
                              name="customer"
                              value="{{ item.customer or '' }}">
                    </div>

                </div>

                <!-- Quantity -->
                <div class="row mb-4">

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Quantity</label>
                        <input class="form-control"
                              type="number"
                              name="quantity"
                              value="{{ item.quantity }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Min Quantity</label>
                        <input class="form-control"
                              type="number"
                              name="min_quantity"
                              value="{{ item.min_quantity }}">
                    </div>

                </div>

                <hr class="my-4">

                <h5 class="mb-3">Specifications</h5>

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Thread Size</label>
                        <input class="form-control"
                              name="thread_size"
                              value="{{ item.thread_size or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Sphere (DK)</label>
                        <input class="form-control"
                              name="sphere_dk"
                              value="{{ item.sphere_dk or '' }}">
                    </div>

                </div>

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Length</label>
                        <input class="form-control"
                              name="length"
                              value="{{ item.length or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">ML / EWL</label>
                        <input class="form-control"
                              name="ml_ewl"
                              value="{{ item.ml_ewl or '' }}">
                    </div>

                </div>

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Tip Material</label>
                        <input class="form-control"
                              name="tip_material"
                              value="{{ item.tip_material or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Shaft Material</label>
                        <input class="form-control"
                              name="shaft_material"
                              value="{{ item.shaft_material or '' }}">
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6">
                        <label class="form-label">Probe Type</label>
                        <input class="form-control"
                              name="probe_type"
                              value="{{ item.probe_type or '' }}">
                    </div>

                    <div class="col-md-6">

                        {% if item.link %}
                            <label class="form-label">Reference</label><br>

                            <a href="{{ item.link }}"
                              target="_blank"
                              class="btn btn-outline-primary">
                                <i class="bi bi-box-arrow-up-right"></i>
                                Open Product Page
                            </a>
                        {% endif %}

                    </div>

                </div>

            </div>

            <div class="card-footer bg-white">

                <div class="d-flex align-items-center">

                    <button class="btn"
                            style="background:#1f396e;color:white;"
                            type="submit">
                        Save Changes
                    </button>

                    <a class="btn btn-secondary ms-2"
                      href="{{ url_for('probe_inventory_list') }}">
                        <i class="bi bi-arrow-return-left"></i>
                    </a>

                    <a class="btn btn-danger ms-auto"
                      href="{{ url_for('remove_probe_inventory_item', item_id=item.id) }}"
                      onclick="return confirm('Are you sure you want to remove this item from inventory?');">
                        <i class="bi bi-trash"></i> Remove
                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="col-lg-4">

        <div class="card shadow-sm">

            <div class="card-header bg-white">
                <h5 class="mb-0">Image</h5>
            </div>

            <div class="card-body text-center">

              {% if item.image_path %}
                  <img src="{{ url_for('static', filename='uploads/' ~ item.image_path) }}"
                      class="img-fluid rounded border"
                      style="height:300px; width:100%; object-fit:contain;">
              {% else %}
                  <div class="border rounded d-flex align-items-center justify-content-center text-muted"
                      style="height:300px;">
                      No image uploaded
                  </div>
              {% endif %}

            </div>

            <div class="card-footer bg-white">
                <input
                    class="form-control"
                    type="file"
                    name="image"
                    accept="image/*">
            </div>

        </div>

    </div>

<input type="hidden"
       name="last_modify_date"
       value="{{ item.last_modify_date }}">

</form>

{% endblock %}
