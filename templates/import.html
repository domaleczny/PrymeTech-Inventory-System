{% extends 'layout.html' %}
{% block content %}
  <h2>Import Excel File</h2>
  <form method="post" enctype="multipart/form-data">
    <p>Upload inventory Excel file to import data.</p>
    <div class="mb-3">
      <input class="form-control" type="file" name="file" accept=".xlsx,.xls">
    </div>
    <button class="btn btn-primary mb-4">Import</button>
  </form>
  
{% endblock %}
